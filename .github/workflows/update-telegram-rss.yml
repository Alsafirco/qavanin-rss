name: Update Telegram RSS

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-rss-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build combined feed
        run: python scripts/build_telegram_rss.py
      - name: Commit updated feed
        run: |
          if git diff --quiet -- telegram-feed.xml yalda-register-services.xml; then
            echo "Feed unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram-feed.xml yalda-register-services.xml
          git commit -m "Update combined Telegram RSS"
          git push
