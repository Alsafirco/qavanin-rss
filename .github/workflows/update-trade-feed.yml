name: Update Iran Trade RSS

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'trade_rss.py'
      - 'trade-feed.xml'
      - '.github/workflows/update-trade-feed.yml'
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: iran-trade-rss
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build merged RSS
        run: python trade_rss.py
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade-feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update unified Iran trade RSS"
            git push
          else
            echo "Feed is unchanged."
          fi
